<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Replace this with your target origin (no trailing slash)
    const TARGET = "https://netdenizen.org";

    // Forward whatever path the visitor used, keeping query + hash
    window.location.replace(TARGET + window.location.pathname
                          + window.location.search
                          + window.location.hash);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://netdenizen.org/">
  </noscript>
</head>
<body>
  <p>Redirecting to
    <a href="#" id="l">netdenizen.org</a>…</p>
  <script>
    document.getElementById('l').href =
      TARGET + window.location.pathname;
    document.getElementById('l').textContent =
      TARGET + window.location.pathname;
  </script>
</body>
</html>
